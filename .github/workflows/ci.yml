name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check bot.js

      - name: Verify no secrets in code
        run: |
          if grep -rE '(TELEGRAM_TOKEN|GROQ_API_KEY)\s*=\s*["'"'"'][^"'"'"' ]{8,}' bot.js; then
            echo "ERROR: Hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets found"